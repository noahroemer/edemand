[project]
name = "demand-forecast"
version = "0.1.0"
description = "Multi-region probabilistic day-ahead electricity demand forecasting"
requires-python = ">=3.12,<3.13"

# Kept small on purpose: these are the only deps the serving image would need.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "numpy>=1.26",
    "holidays>=0.57",
]

[project.optional-dependencies]
# Ingestion (the HTTP clients in ingest/) plus Databricks Connect for local development.
pipeline = [
    "databricks-connect>=16.1",
    "databricks-sdk>=0.36",
    "mlflow>=2.17",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pyarrow>=17.0",
    "pandas>=2.2",
]

# Modeling stack. Not needed by ingest/ or by serving - see CLAUDE.md section 6.
modeling = [
    "pymc>=5.17",
    "arviz>=0.20",
    "pygam>=0.9",
    "statsmodels>=0.14",
    "properscoring>=0.1",
    "scipy>=1.14",
    "scikit-learn>=1.5",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "ANN", # type hints required by CLAUDE.md section 12
    "DTZ", # flake8-datetimez: flags naive datetimes, the #1 bug source in this domain
]
ignore = [
    "ANN401", # dynamically typed **kwargs
    "E501",   # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks run top-level and use %magic commands.
"databricks/*.py" = ["E402", "ANN"]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "databricks: requires a live Databricks connection (deselect with -m 'not databricks')",
    "network: hits a real external API (deselect with -m 'not network')",
]
